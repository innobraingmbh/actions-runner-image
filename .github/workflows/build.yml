name: Build

on:
  push:
    branches: [main]
  schedule:
    # Weekly: picks up the Ubuntu, PHP and Node security updates. The base
    # image and the actions are pinned by digest, Dependabot bumps them.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/innobraingmbh/actions-runner-php:8.4
            ghcr.io/innobraingmbh/actions-runner-php:8.4-${{ github.run_number }}

      # Signed statement that this workflow, from this commit, built the digest
      # the tag points at. Verify with
      # gh attestation verify oci://ghcr.io/innobraingmbh/actions-runner-php:8.4 --owner innobraingmbh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/innobraingmbh/actions-runner-php
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
