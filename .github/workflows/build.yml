name: Build

on:
  push:
    branches: [main]
  schedule:
    # Weekly: the base image moves and ARC's ephemeral runners must stay recent.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/innobraingmbh/actions-runner-php:8.4
            ghcr.io/innobraingmbh/actions-runner-php:8.4-${{ github.run_number }}
