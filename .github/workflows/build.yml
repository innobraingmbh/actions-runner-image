name: Build

on:
  push:
    branches: [main]
  schedule:
    # Weekly: picks up the Ubuntu, PHP and Node security updates. The base
    # image and the actions are pinned by digest, Dependabot bumps them.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's default docker driver can't attach attestations.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/innobraingmbh/actions-runner-php:latest
            ghcr.io/innobraingmbh/actions-runner-php:${{ github.run_number }}

      - name: Smoke test
        env:
          IMAGE: ghcr.io/innobraingmbh/actions-runner-php@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" bash -euc '
            php -v | grep "^PHP 8.4"
            php8.5 -v | grep "^PHP 8.5"
            php-config8.4 --version && php-config8.5 --version
            node -v | grep "^v22"
            composer --version
            test -f "$RUNNER_TOOL_CACHE/node/$(node -v | tr -d v)/arm64.complete"
          '

      # Signed statement that this workflow, from this commit, built the digest
      # the tag points at. Verify with
      # gh attestation verify oci://ghcr.io/innobraingmbh/actions-runner-php:latest --owner innobraingmbh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/innobraingmbh/actions-runner-php
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
